name: Build Stable APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.84.1"

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove proprietary dependencies
        run: sh scripts/remove_proprietary_dependencies.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: ${{ env.RUST_VERSION }}

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK (Release Arm64-v8a with R8 Minification)
        working-directory: app
        run: |
          # If key.properties does not exist, Gradle won't apply release signing
          flutter build apk --target-platform android-arm64 --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stable-arm64-apk
          path: app/build/app/outputs/flutter-apk/*.apk
